<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary SEO Meta Tags - Revenue Optimized -->
    <title>EVMint - Multi-Chain Token Launcher | Deploy on 15+ EVM Chains Instantly</title>
    <meta name="title" content="EVMint - Multi-Chain Token Launcher | Deploy on 15+ EVM Chains Instantly" />

    <meta name="description" content="Create ERC20 tokens on 15+ EVM blockchains instantly! Ethereum, Base, Arbitrum, Polygon & more. No coding, ultra-low fees, instant deployment. Start your crypto project today with EVMint!" />

    <!-- Google Fonts — ONE render-blocking request, preconnects first.
         Order matters: the preconnects must be parsed before the stylesheet
         href so the TLS handshakes to googleapis/gstatic overlap the request
         instead of following it. Do not move the stylesheet above them.
         Families and weights are exactly what src/ renders:
           Exo 2          body / font-sans      400 500 600 700
           Orbitron       h1-h6 / font-display  400 500 600 700 900
           Source Serif 4 long-form prose       400 700
         (Exo 2 300 and Orbitron 800 dropped — zero font-light/font-extrabold
          in src/. See report for the JetBrains Mono + DM Sans removal.)
         display=swap keeps text visible during font load. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700&family=Orbitron:wght@400;500;600;700;900&family=Source+Serif+4:wght@400;700&display=swap"
    />

    <meta name="keywords" content="evmint, multi-chain token launcher, erc20 token generator, create cryptocurrency, evm blockchain, no code crypto, token launcher, defi token maker, ethereum token, base token, arbitrum, polygon, multi-chain deployment, cheap token deployment" />
    <meta name="author" content="EVMint" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://evmint.io" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://evmint.io" />
    <meta property="og:title" content="EVMint - Multi-Chain EVM Token Launcher" />
    <meta property="og:description" content="Create and deploy ERC20 tokens on 15+ EVM blockchains. Ethereum, Base, Arbitrum, Polygon & more. Ultra-low fees. No coding required. Start your crypto project today!" />
    <meta property="og:image" content="https://evmint.io/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="EVMint" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://evmint.io" />
    <meta property="twitter:title" content="EVMint - Multi-Chain EVM Token Launcher" />
    <meta property="twitter:description" content="Create ERC20 tokens on 15+ EVM blockchains instantly! Ethereum, Base, Arbitrum, Polygon & more. Ultra-low fees. No coding required." />
    <meta property="twitter:image" content="https://evmint.io/twitter-image.png" />
    <meta property="twitter:creator" content="@evmint" />

    <!-- Additional SEO -->
    <meta name="theme-color" content="#0052FF" />
    <meta name="application-name" content="EVMint" />
    <meta name="apple-mobile-web-app-title" content="EVMint" />
    <meta name="msapplication-TileColor" content="#0052FF" />
    
    <!-- Performance Optimizations -->
    <link rel="dns-prefetch" href="//base.org" />
    <link rel="dns-prefetch" href="//basescan.org" />
    <link rel="dns-prefetch" href="//uniswap.org" />
    <link rel="dns-prefetch" href="//coinbase.com" />
    <link rel="dns-prefetch" href="//privy.io" />
    
    <!-- Critical CSS Preload (add when you have critical CSS) -->
    <!-- <link rel="preload" href="/critical.css" as="style" onload="this.onload=null;this.rel='stylesheet'"> -->
    
    <!-- Logo is rendered by React, no need to preload -->
    
    <!-- Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Schema.org markup -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "EVMint",
      "description": "Create ERC20 tokens on 15+ EVM blockchains with no coding required",
      "url": "https://evmint.io",
      "applicationCategory": "FinanceApplication",
      "operatingSystem": "Web Browser",
      "offers": {
        "@type": "Offer",
        "price": "80",
        "priceCurrency": "USD",
        "availability": "https://schema.org/InStock",
        "priceValidUntil": "2027-12-31",
        "description": "~$80 equivalent per token deployment on any supported chain, paid in native token. Same price across all 15+ EVM networks."
      },
      "creator": {
        "@type": "Organization",
        "name": "EVMint",
        "url": "https://evmint.io"
      },
      "featureList": [
        "No code token creation",
        "15+ EVM blockchain support",
        "Multi-DEX integration",
        "Ultra-low fees on L2 chains",
        "Instant deployment",
        "Multi-chain liquidity support"
      ]
    }
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Instant splash screen — pure CSS, zero JS, replaced when React mounts -->
      <div id="splash" style="
        position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
        background:#111827;color:#fff;font-family:system-ui,sans-serif;
        gap:28px;z-index:9999;
      ">
        <!-- Logo — inline SVG of the three hexagons -->
        <div style="width:64px;height:50px;filter:drop-shadow(0 0 20px rgba(59,130,246,0.3));">
          <svg viewBox="0 0 180 140" fill="none" xmlns="http://www.w3.org/2000/svg" width="64" height="50">
            <g transform="translate(50,0)"><path d="M50 0L93.3 25V75L50 100L6.7 75V25Z" fill="#06B6D4" opacity=".9"/></g>
            <g transform="translate(10,40) scale(.9)"><path d="M50 0L93.3 25V75L50 100L6.7 75V25Z" fill="#A855F7" opacity=".85"/></g>
            <g transform="translate(90,40) scale(.9)"><path d="M50 0L93.3 25V75L50 100L6.7 75V25Z" fill="#3B82F6" opacity=".9"/></g>
          </svg>
        </div>
        <!-- Loading bar -->
        <div style="width:160px;height:3px;background:#1f2937;border-radius:4px;overflow:hidden;">
          <div style="
            width:40%;height:100%;border-radius:4px;
            background:linear-gradient(90deg,#06B6D4,#3B82F6,#A855F7);
            animation:splash-slide 1.2s ease-in-out infinite;
          "></div>
        </div>
        <style>
          @keyframes splash-slide{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}
          body{margin:0;background:#111827}
        </style>
      </div>
    </div>
    <script>
      // Safety net: remove splash after 8s even if React fails to mount
      setTimeout(function(){var s=document.getElementById('splash');if(s)s.remove()},8000)
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
