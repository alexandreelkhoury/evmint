<svg width="180" height="140" viewBox="0 0 180 140" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient for cyan hexagon -->
    <linearGradient id="hexagon-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0891B2" stop-opacity="0.95" />
    </linearGradient>

    <!-- Gradient for purple hexagon -->
    <linearGradient id="hexagon-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#9333EA" stop-opacity="0.9" />
    </linearGradient>

    <!-- Gradient for blue hexagon -->
    <linearGradient id="hexagon-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0.95" />
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Cyan hexagon (top) -->
  <g transform="translate(50, 0) scale(1)">
    <path
      d="M50 0 L93.3 25 L93.3 75 L50 100 L6.7 75 L6.7 25 Z"
      fill="url(#hexagon-cyan)"
      stroke="rgba(255, 255, 255, 0.1)"
      stroke-width="1"
      filter="url(#glow)"
    />
  </g>

  <!-- Purple hexagon (bottom left) -->
  <g transform="translate(10, 40) scale(0.9)">
    <path
      d="M50 0 L93.3 25 L93.3 75 L50 100 L6.7 75 L6.7 25 Z"
      fill="url(#hexagon-purple)"
      stroke="rgba(255, 255, 255, 0.1)"
      stroke-width="1"
      filter="url(#glow)"
    />
  </g>

  <!-- Blue hexagon (bottom right) -->
  <g transform="translate(90, 40) scale(0.9)">
    <path
      d="M50 0 L93.3 25 L93.3 75 L50 100 L6.7 75 L6.7 25 Z"
      fill="url(#hexagon-blue)"
      stroke="rgba(255, 255, 255, 0.1)"
      stroke-width="1"
      filter="url(#glow)"
    />
  </g>
</svg>
